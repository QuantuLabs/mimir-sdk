name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Closed program id guard
        run: |
          hits=$(git grep -n "hMuPDstPQEb5uaYc6d5N18Rz4srL1Bewc5fYibMimiR" -- . ':!tests/fixtures/**' ':!CHANGELOG.md' ':!.github/workflows/ci.yml' | grep -v CLOSED || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "The closed program id hMuPD... may appear only in tests/fixtures, CHANGELOG.md and a CLOSED denylist"
            exit 1
          fi
          paths=$(git grep -a -n -E '/(Users|home|Volumes)/[A-Za-z]' -- . ':!.github/workflows/ci.yml' || true)
          if [ -n "$paths" ]; then
            echo "$paths"
            echo "Local filesystem paths in tracked files (binaries included)"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Easy API tests (Node 20)
        if: matrix.node == 20
        run: node --import tsx tests/easy/price.test.ts
      # The full suite uses node:test module mocks; the package smoke builds with Vite 8.
      - if: matrix.node == 24
        run: npm test
      - if: matrix.node == 24
        run: npm run test:package
      - if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - if: matrix.node == 24
        run: npm run test:browser
